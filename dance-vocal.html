<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dance and Vocal photography gallery by AV Photos in DFW.">
  <title>Dance/Vocal - AV Photos</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="header__logo">
        <img src="images/photography logo.png" alt="AV Photos">
      </a>

      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="about.html" class="nav__link">About</a>
        <a href="dance-vocal.html" class="nav__link">Dance/Vocal</a>
        <a href="testimonials.html" class="nav__link">Testimonials</a>
        <a href="faq.html" class="nav__link">FAQ</a>
        <a href="tel:4694037497" class="nav__link">Contact</a>
      </nav>

      <button class="menu-toggle" aria-label="Toggle menu">
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="section section--hero">
      <div class="container">
        <h1>Dance/Vocal</h1>
        <p class="lead">Dedicated galleries for dance and vocal moments</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>Dance</h2>
        <div class="gallery">
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_233.JPG" alt="Dance performance moment" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_0294.jpg" alt="Dance portrait" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_0252.jpg" alt="Dance event capture" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_425.JPG" alt="Dance pose photography" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_0363.jpg" alt="Dance celebration image" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_409.JPG" alt="Dance candid shot" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/dance/IMG_0344.jpg" alt="Dance family moment" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>Vocal</h2>
        <div class="gallery gallery--vocal">
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG_7.JPG" alt="Vocal performance image" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image gallery__image--reference" src="images/vocal/IMG_14.JPG" alt="Vocal portrait capture" loading="lazy">
          </div>
          <div class="gallery__item gallery__item--featured">
            <img class="gallery__image gallery__image--match-reference" src="images/vocal/IMG-89.jpg" alt="Vocal event photo" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG-157.jpg" alt="Vocal candid moment" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG_12.JPG" alt="Vocal celebration shot" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG_26.JPG" alt="Vocal gathering image" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG-111.jpg" alt="Vocal session photo" loading="lazy">
          </div>
          <div class="gallery__item">
            <img class="gallery__image" src="images/vocal/IMG-95.jpg" alt="Vocal stage moment" loading="lazy">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- JavaScript -->
  <script src="js/footer.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/lazyload.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      function matchVocalImageHeight() {
        var reference = document.querySelector('.gallery--vocal .gallery__image--reference');
        var target = document.querySelector('.gallery--vocal .gallery__image--match-reference');
        if (!reference || !target) return;

        var referenceHeight = Math.round(reference.getBoundingClientRect().height);
        if (!referenceHeight) return;

        target.style.height = referenceHeight + 'px';
        target.style.width = 'auto';
        target.style.maxWidth = 'none';
        target.style.objectFit = 'contain';
      }

      window.addEventListener('load', matchVocalImageHeight);
      window.addEventListener('resize', matchVocalImageHeight);
      setTimeout(matchVocalImageHeight, 200);
    })();
  </script>
</body>
</html>
